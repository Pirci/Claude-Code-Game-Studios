# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: effective_region_income
    status: active
    source: design/gdd/resource-system.md
    referenced_by:
      - design/gdd/resource-system.md
      - design/gdd/spirit-system.md   # bozulma çarpanı M_c girdisi
    variables:
      - G_base
      - corruption_level
      - CORRUPTION_PRODUCTION_MULTIPLIERS
    output_range: [0, 5]
    # was: "floor(G_base * max(0, 1 - corruption_level * PROD_PENALTY_PER_LEVEL))" before 2026-10-08 (K1, consistency check)
    expression: "floor(G_base * CORRUPTION_PRODUCTION_MULTIPLIERS[corruption_level])"
    added: 2026-10-08
    revised: 2026-10-08

  - name: turn_income
    status: active
    source: design/gdd/resource-system.md
    referenced_by:
      - design/gdd/resource-system.md
      - design/gdd/spirit-system.md       # B_add / M_g ekonomi lütufları
      - design/gdd/region-map-system.md   # AC5, ekonomi adımı
    variables:
      - I_raw
      - B_add
      - M_g
      - I_floor
    output_range: [0, 100]
    expression: "max(I_floor, floor((I_raw + B_add) * M_g)); 0 if player owns no region"
    added: 2026-10-08
    revised: ""

  - name: recruit_cap
    status: active
    source: design/gdd/resource-system.md
    referenced_by:
      - design/gdd/resource-system.md
    variables:
      - R_min
      - G_eff
    output_range: [0, 5]   # 2026-10-19 (C-53): was [1, 5]; 0 only if R_min = 0 (MVP R_min = 1 → 1–5)
    expression: "max(R_min, G_eff)"
    notes: "HUD/bilgi paneli kalan tavanı gösterir. G_eff bozulma çarpanını içerir (spirit M_c)."
    added: 2026-10-08
    revised: 2026-10-19

  - name: corruption_strength
    status: active
    source: design/gdd/spirit-system.md
    referenced_by:
      - design/gdd/spirit-system.md   # §4.1, §3.2 arındırma
      - design/gdd/army-system.md     # §3.3 varış 2. dalı, §4 eşik tablosu
      - design/gdd/combat-system.md   # §5 resolve(P, corruption_strength)
    variables:
      - corruption_level
      - CORR_STR_PER_LEVEL
    output_range: [0, 12]
    expression: "corruption_level * CORR_STR_PER_LEVEL; purification succeeds iff P > corruption_strength"
    notes: "C-30: P = gelen kuvvet; başarıda kalan P - ceil(S * attacker_win_loss_ratio), başarısızlıkta 0."
    added: 2026-10-18
    revised: ""

  - name: erlik_power
    status: active
    source: design/gdd/spirit-system.md
    referenced_by:
      - design/gdd/spirit-system.md       # §4.7, §3.7 Erlik'in Gölgesi
      - design/gdd/region-map-system.md   # §3.6 Erlik kaybı, §4 kaybetme kontrolü
      - design/gdd/resource-system.md     # §4 Prolog doğrulaması
    variables:
      - corruption_level
      - erlik_loss_threshold
    output_range: [0, 18]   # Prolog: 6 bölge × 3
    expression: "sum(corruption_level over all regions); lost iff erlik_loss_threshold > 0 and erlik_power >= erlik_loss_threshold (end_turn step 5 only)"
    notes: "C-49. Türetilir, saklanmaz. Yayılım +1, arındırma -L. Prolog başlangıcı 4 (in 3 + Doğu Obası 1)."
    added: 2026-10-19
    revised: ""

