# ─── CONSTANTS ───────────────────────────────────────────────────────────────
# Named numerical values referenced across multiple systems.
# Register a constant when it is defined in one GDD but another GDD must
# agree with it (e.g., gold carry limit defined in economy but checked in
# inventory, or base inventory slots defined in inventory but displayed in HUD).
#
# Required fields: name, status, source, referenced_by, value, unit, added

constants:
  - name: recruit_cost
    status: active
    source: design/gdd/resource-system.md
    referenced_by:
      - design/gdd/resource-system.md
      - design/gdd/army-system.md   # üretim army_count'u artırır
    value: 2
    unit: gold
    added: 2026-10-08
    revised: ""

  - name: starting_gold_ch1
    status: active
    source: design/gdd/resource-system.md
    referenced_by:
      - design/gdd/resource-system.md
      - design/gdd/region-map-system.md   # ChapterMapDefinition taşır
    value: 6
    unit: gold
    added: 2026-10-08
    revised: ""

  - name: enemy_reinforcement_per_turn_ch1
    status: active
    source: design/gdd/resource-system.md
    referenced_by:
      - design/gdd/resource-system.md
      - design/gdd/region-map-system.md   # ekonomi adımı, ChapterMapDefinition
    value: 1
    unit: army per enemy region per turn
    added: 2026-10-08
    revised: ""

  - name: prod_penalty_per_level
    status: deprecated   # 2026-10-08: replaced by corruption_production_multipliers (K1)
    source: design/gdd/spirit-system.md
    referenced_by:
      - design/gdd/spirit-system.md
      - design/gdd/resource-system.md   # F1
    value: 0.25
    unit: fraction of production per corruption level
    added: 2026-10-08
    revised: ""

  - name: corruption_production_multipliers
    status: active
    source: design/gdd/spirit-system.md
    referenced_by:
      - design/gdd/spirit-system.md
      - design/gdd/resource-system.md   # F1 M_c
    value: [1.0, 0.75, 0.5, 0.0]
    unit: production multiplier per corruption level 0–3
    added: 2026-10-08
    revised: ""

  - name: actions_per_turn
    status: active
    source: design/gdd/region-map-system.md
    referenced_by:
      - design/gdd/region-map-system.md
      - design/gdd/army-system.md       # her hareket 1 aksiyon
      - design/gdd/resource-system.md   # üretim aksiyon harcamaz
    value: 1
    unit: player actions per turn (MVP)
    added: 2026-10-08
    revised: ""

  - name: enemy_actions_per_turn
    status: active
    source: design/gdd/region-map-system.md
    referenced_by:
      - design/gdd/region-map-system.md
      - docs/architecture/adr-0005-ai-architecture.md
    value: 1
    unit: enemy actions per turn (MVP)
    added: 2026-10-08
    revised: ""

  - name: garrison_minimum
    status: active
    source: design/gdd/army-system.md
    referenced_by:
      - design/gdd/army-system.md
      - design/gdd/region-map-system.md   # düşman AI aynı kuralla army−1 gönderir
      - design/gdd/resource-system.md     # üret + hareket: army_count − 1
    value: 1
    unit: army left in source region
    added: 2026-10-08
    revised: ""

